<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKSHEET OCR EXTRACTOR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .upload-area {
            width: 50%;
            margin: auto;
            padding: 20px;
            border: 2px dashed #ccc;
            text-align: center;
            cursor: pointer;
        }
        .upload-area.highlight {
            border-color: #000;
        }
        input[type="file"] {
            display: none;
        }
        .container {
            width: 50%;
            margin: auto;
        }
        table {
            width: 50%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>UPLOAD MARKSHEET TO EXTRACT DATA</h2>
    <div class="upload-area" id="upload-area">Drag & Drop File Here or Click to Upload</div>
    <input type="file" id="imageUpload" accept="image/*">
    <br>
    
    <div class="container">
        <label>NAME: <input type="text" id="name"></label><br>
        <label>FATHER'S NAME: <input type="text" id="father"></label><br>
        <label>MOTHER'S NAME: <input type="text" id="mother"></label><br>
        <label>ROLL NO: <input type="text" id="roll"></label><br>
        <label>DATE OF BIRTH: <input type="text" id="dob"></label><br>
        <label>SCHOOL NAME: <input type="text" id="school"></label><br>
        <label>EMIS ID: <input type="text" id="emis"></label><br>
    </div>
    
    <h3>MARKS OBTAINED</h3>
    <table>
        <tr><th>SUBJECT</th><th>MARKS</th></tr>
        <tr><td>TAMIL</td><td id="tamil"></td></tr>
        <tr><td>ENGLISH</td><td id="english"></td></tr>
        <tr><td>MATHEMATICS</td><td id="math"></td></tr>
        <tr><td>SCIENCE</td><td id="science"></td></tr>
        <tr><td>SOCIAL SCIENCE</td><td id="social"></td></tr>
        <tr><td>TOTAL MARKS</td><td id="total"></td></tr>
    </table>

    <script>
        const API_KEY = "K84800146788957"; // REPLACE WITH YOUR ACTUAL API KEY
        const uploadArea = document.getElementById("upload-area");
        const fileInput = document.getElementById("imageUpload");

        uploadArea.addEventListener("click", () => fileInput.click());
        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("highlight");
        });
        uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("highlight"));
        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("highlight");
            fileInput.files = e.dataTransfer.files;
            processImage();
        });
        fileInput.addEventListener("change", processImage);

        function processImage() {
            let file = fileInput.files[0];
            if (!file) return;
            
            let formData = new FormData();
            formData.append("apikey", API_KEY);
            formData.append("language", "eng");
            formData.append("isOverlayRequired", "false");
            formData.append("file", file);

            fetch("https://api.ocr.space/parse/image", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.OCRExitCode === 1) {
                    let text = data.ParsedResults[0].ParsedText;
                    console.log("EXTRACTED TEXT:", text);
                    autoFillFields(text);
                } else {
                    alert("OCR FAILED: " + data.ErrorMessage);
                }
            })
            .catch(error => console.error("ERROR:", error));
        }

        function autoFillFields(text) {
            document.getElementById('name').value = extractNextLine(text, "NAME OF THE CANDIDATE", 2).toUpperCase();
            document.getElementById('father').value = extractNextLine(text, "GUARDIAN'S NAME", 1).toUpperCase();
            document.getElementById('mother').value = extractNextLine(text, "GUARDIAN'S NAME", 2).toUpperCase();
            document.getElementById('roll').value = extractNextLine(text, "ROLL NO").toUpperCase();
            document.getElementById('dob').value = extractNextLine(text, "DATE OF BIRTH").toUpperCase();
            document.getElementById('school').value = extractNextLine(text, "NAME OF THE SCHOOL", 2).toUpperCase();
            document.getElementById('emis').value = extractEMIS(text);
            
            let marksArray = extractMarks(text);
            document.getElementById('tamil').innerText = marksArray[0] || "";
            document.getElementById('english').innerText = marksArray[1] || "";
            document.getElementById('math').innerText = marksArray[2] || "";
            document.getElementById('science').innerText = marksArray[3] || "";
            document.getElementById('social').innerText = marksArray[4] || "";
            document.getElementById('total').innerText = marksArray[5] || "";
        }

        function extractNextLine(text, field, skipLines = 1) {
            let lines = text.split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes(field)) {
                    return lines[i + skipLines] ? lines[i + skipLines].trim() : "";
                }
            }
            return "";
        }

        function extractEMIS(text) {
            let match = text.match(/EMIS ID No\.\s*(\d{16})/);
            return match ? match[1] : "Not Found";
        }

        function extractMarks(text) {
            let marksPattern = /MARKS OBTAINED FOR\s*(\d+)\s*(\d+)\s*(\d+)\s*(\d+)\s*(\d+)\s*(\d+)/;
            let match = text.match(marksPattern);
            return match ? match.slice(1) : [];
        }
    </script>
</body>
</html>
